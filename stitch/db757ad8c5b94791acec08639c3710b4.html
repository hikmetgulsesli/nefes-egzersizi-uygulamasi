<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "outline-variant": "#414752",
              "surface": "#10141a",
              "on-background": "#dfe2eb",
              "background": "#10141a",
              "on-surface": "#dfe2eb",
              "surface-container-lowest": "#0a0e14",
              "surface-container-highest": "#31353c",
              "on-secondary": "#2c3138",
              "surface-container": "#1c2026",
              "on-primary": "#00315c",
              "surface-variant": "#31353c",
              "tertiary": "#ffb77c",
              "surface-container-low": "#181c22",
              "secondary-container": "#42474f",
              "on-primary-container": "#003a6b",
              "surface-container-high": "#262a31",
              "primary-container": "#58a6ff",
              "primary": "#a2c9ff",
              "on-surface-variant": "#c0c7d4",
              "tertiary-container": "#e48f43"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(88, 166, 255, 0.08);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .orb-glow {
            box-shadow: 0 0 80px rgba(162, 201, 255, 0.15);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body antialiased min-h-screen flex items-center justify-center p-4">
<!-- Background Atmospheric Elements -->
<div class="fixed inset-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-tertiary/5 blur-[120px]"></div>
</div>
<!-- Main Modal Container -->
<div class="relative w-full max-w-2xl glass-panel rounded-xl overflow-hidden shadow-[0px_24px_48px_rgba(0,0,0,0.4)] border border-white/5">
<!-- Header Section -->
<div class="p-8 md:p-12 text-center relative">
<div class="mb-8 flex justify-center">
<div class="w-24 h-24 rounded-full bg-gradient-to-tr from-primary to-primary-container flex items-center justify-center orb-glow">
<span class="material-symbols-outlined text-on-primary text-4xl" style="font-variation-settings: 'FILL' 1;">done_all</span>
</div>
</div>
<h1 class="text-4xl md:text-5xl font-light tracking-tight text-on-surface mb-2">Harika İş!</h1>
<p class="text-on-surface-variant font-light tracking-wide uppercase text-xs opacity-70">Seans başarıyla tamamlandı</p>
</div>
<!-- Summary Grid (Bento Style) -->
<div class="px-8 md:px-12 grid grid-cols-1 md:grid-cols-3 gap-4 mb-10">
<div class="bg-surface-container-low p-6 rounded-lg flex flex-col items-center justify-center text-center">
<span class="text-on-surface-variant text-[10px] uppercase tracking-widest mb-1">Teknik</span>
<span class="text-primary font-medium">Box Breathing</span>
</div>
<div class="bg-surface-container-low p-6 rounded-lg flex flex-col items-center justify-center text-center">
<span class="text-on-surface-variant text-[10px] uppercase tracking-widest mb-1">Döngü</span>
<span class="text-primary font-medium">6 Cycles</span>
</div>
<div class="bg-surface-container-low p-6 rounded-lg flex flex-col items-center justify-center text-center">
<span class="text-on-surface-variant text-[10px] uppercase tracking-widest mb-1">Süre</span>
<span class="text-primary font-medium">5:00 Minutes</span>
</div>
</div>
<!-- Feedback Section -->
<div class="px-8 md:px-12 space-y-8">
<!-- Mood Selector -->
<div>
<label class="block text-center text-on-surface-variant text-sm font-light mb-6 tracking-wide">Şu an nasıl hissediyorsun?</label>
<div class="flex justify-between items-center max-w-sm mx-auto">
<button class="w-12 h-12 flex items-center justify-center text-2xl grayscale hover:grayscale-0 hover:scale-110 transition-all duration-400 bg-surface-container-high rounded-full focus:ring-2 focus:ring-primary/40 focus:grayscale-0 outline-none">😌</button>
<button class="w-12 h-12 flex items-center justify-center text-2xl grayscale hover:grayscale-0 hover:scale-110 transition-all duration-400 bg-surface-container-high rounded-full focus:ring-2 focus:ring-primary/40 focus:grayscale-0 outline-none">😊</button>
<button class="w-12 h-12 flex items-center justify-center text-2xl grayscale hover:grayscale-0 hover:scale-110 transition-all duration-400 bg-surface-container-high rounded-full focus:ring-2 focus:ring-primary/40 focus:grayscale-0 outline-none">😐</button>
<button class="w-12 h-12 flex items-center justify-center text-2xl grayscale hover:grayscale-0 hover:scale-110 transition-all duration-400 bg-surface-container-high rounded-full focus:ring-2 focus:ring-primary/40 focus:grayscale-0 outline-none">😔</button>
<button class="w-12 h-12 flex items-center justify-center text-2xl grayscale hover:grayscale-0 hover:scale-110 transition-all duration-400 bg-surface-container-high rounded-full focus:ring-2 focus:ring-primary/40 focus:grayscale-0 outline-none">😤</button>
</div>
</div>
<!-- Notes -->
<div class="space-y-3">
<label class="block text-on-surface-variant text-xs uppercase tracking-widest font-light ml-1">Notların (İsteğe Bağlı)</label>
<textarea class="w-full bg-surface-container-lowest border-none rounded-lg p-4 text-on-surface placeholder:text-outline/40 focus:ring-1 focus:ring-primary/20 transition-all duration-400 resize-none" placeholder="Bugün kendimi daha sakin hissediyorum..." rows="3"></textarea>
</div>
</div>
<!-- Action Buttons -->
<div class="p-8 md:p-12 flex flex-col md:flex-row gap-4">
<button class="flex-1 bg-gradient-to-r from-primary to-primary-container text-on-primary font-medium py-4 px-8 rounded-full hover:opacity-90 active:scale-95 transition-all duration-400 shadow-lg shadow-primary/10">
                Kaydet ve Kapat
            </button>
<button class="flex items-center justify-center gap-2 bg-transparent border border-outline-variant/30 text-on-surface-variant font-medium py-4 px-8 rounded-full hover:bg-white/5 active:scale-95 transition-all duration-400">
<span class="material-symbols-outlined text-xl">share</span>
                Paylaş
            </button>
</div>
<!-- Decorative Texture Overlay -->
<div class="absolute inset-0 opacity-[0.03] pointer-events-none bg-[url('https://www.transparenttextures.com/patterns/asfalt-dark.png')]"></div>
</div>
<!-- Hidden Sidebar for context if needed, but suppressed per transactional rule -->
<!-- Navigation is hidden here to focus on the completion modal -->
</body></html>
