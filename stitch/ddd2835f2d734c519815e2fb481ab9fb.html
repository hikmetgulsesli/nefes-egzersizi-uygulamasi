<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nefes - Aktif Egzersiz</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tertiary": "#ffb77c",
              "on-surface": "#dfe2eb",
              "on-tertiary-fixed-variant": "#6d3900",
              "tertiary-container": "#e48f43",
              "on-primary-fixed": "#001c38",
              "background": "#10141a",
              "on-tertiary-fixed": "#2e1500",
              "secondary": "#c2c7d0",
              "secondary-fixed-dim": "#c2c7d0",
              "outline-variant": "#414752",
              "surface-container-lowest": "#0a0e14",
              "tertiary-fixed-dim": "#ffb77c",
              "surface-container-highest": "#31353c",
              "surface-container": "#1c2026",
              "on-secondary": "#2c3138",
              "secondary-fixed": "#dee2ec",
              "primary-fixed": "#d3e4ff",
              "surface-container-low": "#181c22",
              "on-tertiary": "#4d2700",
              "inverse-primary": "#0060aa",
              "outline": "#8b919d",
              "on-primary-fixed-variant": "#004882",
              "on-error": "#690005",
              "surface-container-high": "#262a31",
              "surface": "#10141a",
              "on-tertiary-container": "#5a2e00",
              "on-primary-container": "#003a6b",
              "error": "#ffb4ab",
              "secondary-container": "#42474f",
              "primary-container": "#58a6ff",
              "tertiary-fixed": "#ffdcc2",
              "surface-bright": "#353940",
              "surface-variant": "#31353c",
              "on-surface-variant": "#c0c7d4",
              "inverse-surface": "#dfe2eb",
              "surface-tint": "#a2c9ff",
              "on-primary": "#00315c",
              "primary-fixed-dim": "#a2c9ff",
              "surface-dim": "#10141a",
              "error-container": "#93000a",
              "on-error-container": "#ffdad6",
              "on-background": "#dfe2eb",
              "on-secondary-fixed": "#171c23",
              "on-secondary-fixed-variant": "#42474f",
              "on-secondary-container": "#b1b5bf",
              "inverse-on-surface": "#2d3137",
              "primary": "#a2c9ff"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
        }
        .breathing-glow {
            box-shadow: 0 0 80px 20px rgba(162, 201, 255, 0.15);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body selection:bg-primary-container selection:text-on-primary-container">
<!-- Navigation Shell Suppressed for Focus: Transactional/Task Flow Rule -->
<main class="min-h-screen flex flex-col items-center justify-between p-8 md:p-12 relative overflow-hidden">
<!-- Subtle Ambient Background -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="absolute -top-1/2 -left-1/4 w-[150%] h-[150%] bg-gradient-to-br from-primary/5 via-transparent to-tertiary/5 blur-[120px]"></div>
</div>
<!-- Header: Contextual Metadata -->
<header class="w-full max-w-5xl flex justify-between items-start z-10">
<div class="flex flex-col gap-1">
<span class="text-xs uppercase tracking-[0.2em] text-primary/60 font-medium">Şu Anki Egzersiz</span>
<h1 class="text-2xl font-light tracking-tight text-on-surface">Derin Rahatlama</h1>
</div>
<div class="flex flex-col items-end gap-1">
<span class="text-xs uppercase tracking-[0.2em] text-primary/60 font-medium">Döngü</span>
<div class="bg-white/5 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/5 text-lg font-light tracking-widest">
                    2<span class="text-white/30 mx-1">/</span>6
                </div>
</div>
</header>
<!-- The Breathing Orb (Signature Component) -->
<section class="relative flex flex-col items-center justify-center flex-1 w-full z-10">
<div class="relative group cursor-default">
<!-- Outer Ring Glows -->
<div class="absolute inset-0 bg-primary/20 rounded-full blur-[100px] opacity-40 scale-125"></div>
<!-- Main Orb -->
<div class="w-64 h-64 md:w-80 md:h-80 rounded-full bg-gradient-to-br from-primary to-primary-container flex flex-col items-center justify-center breathing-glow border border-white/10 relative">
<!-- Glass Texture Overlay -->
<div class="absolute inset-0 rounded-full bg-white/5 backdrop-blur-[2px]"></div>
<!-- Content -->
<div class="relative z-10 flex flex-col items-center text-on-primary">
<span class="text-xs uppercase tracking-[0.3em] font-medium opacity-80 mb-2">Nefes Al</span>
<span class="text-7xl md:text-8xl font-thin tracking-tighter leading-none">3</span>
<span class="text-sm font-light mt-1 opacity-70">saniye</span>
</div>
</div>
<!-- Secondary Orbital Elements -->
<div class="absolute -top-4 -right-4 w-12 h-12 rounded-full bg-surface-container-high/40 backdrop-blur-xl border border-white/5 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-xl">air</span>
</div>
</div>
<!-- Guidance Text -->
<div class="mt-16 text-center max-w-md">
<p class="text-xl md:text-2xl font-light text-on-surface/90 leading-relaxed tracking-tight">
                    Göğüs kafesinin genişlediğini <span class="text-primary font-normal">hisset...</span>
</p>
</div>
</section>
<!-- Interaction & Data Dashboard -->
<footer class="w-full max-w-4xl z-10">
<!-- Metrics Bar -->
<div class="grid grid-cols-2 gap-4 mb-8">
<div class="bg-surface-container-low/40 backdrop-blur-xl p-6 rounded-xl flex items-center gap-5 border border-white/5 group hover:bg-surface-container-low transition-all duration-500">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-primary">
<span class="material-symbols-outlined">schedule</span>
</div>
<div>
<p class="text-[10px] uppercase tracking-[0.15em] text-white/40 mb-1">Toplam Süre</p>
<p class="text-xl font-light tracking-wide">04:12 <span class="text-white/20 text-sm">/ 10:00</span></p>
</div>
</div>
<div class="bg-surface-container-low/40 backdrop-blur-xl p-6 rounded-xl flex items-center gap-5 border border-white/5 group hover:bg-surface-container-low transition-all duration-500">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<div>
<p class="text-[10px] uppercase tracking-[0.15em] text-white/40 mb-1">Kalp Hızı</p>
<p class="text-xl font-light tracking-wide">64 <span class="text-white/20 text-sm">BPM</span></p>
</div>
</div>
</div>
<!-- Controls -->
<div class="flex items-center justify-center gap-8">
<button class="w-14 h-14 rounded-full border border-outline-variant/20 flex items-center justify-center hover:bg-white/5 transition-all duration-400 text-on-surface/70 group">
<span class="material-symbols-outlined text-2xl group-active:scale-90 transition-transform">volume_up</span>
</button>
<button class="px-10 py-5 rounded-full bg-white/5 border border-white/10 hover:bg-white/10 transition-all duration-500 flex items-center gap-3 group active:scale-95">
<div class="w-2 h-2 rounded-full bg-primary shadow-[0_0_8px_rgba(162,201,255,0.6)] group-hover:animate-pulse"></div>
<span class="text-sm font-medium tracking-widest uppercase text-on-surface">Durdur</span>
</button>
<button class="w-14 h-14 rounded-full border border-outline-variant/20 flex items-center justify-center hover:bg-white/5 transition-all duration-400 text-on-surface/70 group">
<span class="material-symbols-outlined text-2xl group-active:scale-90 transition-transform">close</span>
</button>
</div>
<!-- Progress Glow Track -->
<div class="mt-12 h-1 w-full bg-surface-container-highest rounded-full overflow-hidden relative">
<div class="absolute left-0 top-0 h-full bg-primary w-[42%] shadow-[0_0_12px_rgba(162,201,255,0.8)] blur-[1px]"></div>
</div>
</footer>
<!-- Decorative Background Elements -->
<div class="absolute bottom-0 right-0 p-12 opacity-10 pointer-events-none">
<span class="material-symbols-outlined text-[200px] rotate-12">spa</span>
</div>
</main>
</body></html>
